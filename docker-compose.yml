# Local stack: SQL Server + the website.
#   cp .env.example .env   # then edit the passwords
#   docker compose up --build
# Site: http://localhost:8080   Dashboard: http://localhost:8080/admin
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: src/Atlas.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=Atlas;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__ApplyMigrationsOnStartup: "true"
      DisableHttpsRedirection: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__SiteUrl: ${SITE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/App_Data

volumes:
  sqldata:
  appdata:
